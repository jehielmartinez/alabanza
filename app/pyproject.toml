[project]
name = "alabanza"
version = "0.1.0"
description = "Church hymn player appliance (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = ["python-mpv>=1.0.7", "pillow>=10.1"]

[project.optional-dependencies]
# only on the device: talks to the real SSD1309 over I2C
device = ["luma.oled>=3.13"]
# dev: --oled flag opens a window with the exact 128x64 rendering
emu = ["luma.emulator>=1.5"]

[project.scripts]
alabanza = "alabanza.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alabanza"]
