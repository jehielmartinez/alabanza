[project]
name = "alabanza"
version = "0.1.0"
description = "Church hymn player appliance (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = ["python-mpv>=1.0.7"]

[project.scripts]
alabanza = "alabanza.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alabanza"]
